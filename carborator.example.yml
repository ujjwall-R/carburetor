# carborator.yml — copy this to carborator.yml and fill in your values
# Credentials are NEVER stored here — set them as environment variables

project:
  type: react                      # react | node | docker | custom
  build:
    # script: "npm run build:prod" # optional — overrides default
    outputDir: dist                # optional — defaults per project type
    # env:
    #   NODE_ENV: production

target:
  platform: aws                    # aws | gcp | azure | lambda
  region: us-east-1
  environment: production
  resourceId: my-s3-bucket-name    # S3 bucket, instance ID, function name, etc.

vcs:
  provider: github
  repoUrl: "https://github.com/your-org/your-repo"
  branch: main

executor:
  type: local                      # local | jenkins | temporal
  # jenkins:
  #   baseUrl: "https://jenkins.example.com"
  #   jobName: "carborator-deploy"
  #   token: "${JENKINS_API_TOKEN}"
  #   waitForCompletion: true
  #   pollIntervalMs: 10000
