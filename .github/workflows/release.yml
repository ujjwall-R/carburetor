name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binaries
        run: bash scripts/build-all.sh

      - name: Rename binaries with platform suffix
        run: |
          cp dist/macos-arm64/carburetor  dist/carburetor-macos-arm64
          cp dist/macos-x64/carburetor    dist/carburetor-macos-x64
          cp dist/linux-arm64/carburetor  dist/carburetor-linux-arm64
          cp dist/linux-x64/carburetor    dist/carburetor-linux-x64
          cp dist/windows-x64/carburetor.exe dist/carburetor-windows-x64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/carburetor-macos-arm64
            dist/carburetor-macos-x64
            dist/carburetor-linux-arm64
            dist/carburetor-linux-x64
            dist/carburetor-windows-x64.exe
            install.sh
