name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binaries
        run: bash scripts/build-all.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/macos-arm64/carburetor-macos-arm64
            dist/macos-x64/carburetor-macos-x64
            dist/linux-arm64/carburetor-linux-arm64
            dist/linux-x64/carburetor-linux-x64
            dist/windows-x64/carburetor.exe
            install.sh