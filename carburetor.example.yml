# carburetor.yml — copy this to carburetor.yml and fill in your values
# Credentials are NEVER stored here — set them as environment variables

project:
  type: react                      # react | node | docker | custom
  build:
    # script: "npm run build:prod" # optional — overrides default
    outputDir: dist                # optional — defaults per project type
    # env:
    #   NODE_ENV: production

target:
  platform: aws                    # aws | gcp | azure | lambda
  region: us-east-1
  environment: production
  resourceId: my-s3-bucket-name    # S3 bucket, instance ID, function name, etc.

vcs:
  provider: github
  repoUrl: "https://github.com/your-org/your-repo"
  branch: main

executor:
  type: local                      # local | jenkins | temporal
  # jenkins:
  #   baseUrl: "https://jenkins.example.com"
  #   jobName: "carburetor-deploy"
  #   token: "${JENKINS_API_TOKEN}"
  #   waitForCompletion: true
  #   pollIntervalMs: 10000

# ── Docker EC2 deploy example ─────────────────────────────────────────────────
# Use this config (with no vcs section) to deploy a single Docker image to EC2.
# Required env vars: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#   CARBORATOR_EC2_SSH_KEY or CARBORATOR_EC2_SSH_KEY_PATH, CARBORATOR_EC2_SSH_USER
#
# Run:   carburetor deploy --dockerfile ./Dockerfile --port 3000
# Or:    carburetor deploy   (when dockerfilePath is set in this file)
#
# Redeployment is automatic — the running container is replaced on every deploy.
#
# project:
#   type: docker
#   build:
#     dockerfilePath: ./Dockerfile   # relative to this config file
#     containerPort: 3000            # port the container listens on (also bound on the host)
#
# target:
#   platform: aws
#   region: us-east-1
#   environment: production
#   resourceId: i-0123456789abcdef0  # EC2 instance ID (must start with i-)
# ─────────────────────────────────────────────────────────────────────────────
